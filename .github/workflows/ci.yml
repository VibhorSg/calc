name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Cache GoogleTest download
        uses: actions/cache@v4
        with:
          path: build/_deps/googletest-subbuild/googletest-populate-prefix/src
          key: gtest-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          clang-format --version
          find include src apps tests \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure (for compile_commands.json)
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++

      - name: clang-tidy
        run: |
          clang-tidy --version
          find src apps -name '*.cpp' -print0 | xargs -0 clang-tidy -p build
